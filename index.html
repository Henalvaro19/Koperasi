<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koperasi Pangestu Pambudi</title>
  <link rel="stylesheet" href="hitung.css">
</head>
<body>

    <div class="logo">
        <img src="logo koperasi.png" alt="Logo">
        <img src="752-SMKN_1_SURABAYA.png" alt="logo">
    </div>

    <div class="element">
      <!-- <img src="element/Untitled design (1).png" alt=""> -->
      <img src="element/Untitled design (6).png" alt="">
      <!-- <img src="element/Untitled design (7).png" alt=""> -->
    </div>
    
  <div class="content-wrapper">
    <div class="container">
      <h2>(tanggal-bulan-jam)</h2>
      <h1>Website Akan Diluncurkan Dalam</h1>
      <div id="countdown">
        <div class="time">
          <span id="days">00</span><p>Hari</p>
        </div>
        <div class="separator">:</div>
        <div class="time">
          <span id="hours">00</span><p>Jam</p>
        </div>
        <div class="separator">:</div>
        <div class="time">
          <span id="minutes">00</span><p>Menit</p>
        </div>
        <div class="separator">:</div>
        <div class="time">
          <span id="seconds">00</span><p>Detik</p>
        </div>
      </div>
    </div>
  </div>

  <script src="hitung.js"></script>
</body>
</html>
