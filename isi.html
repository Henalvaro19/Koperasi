<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Koperasi Pangestu Pambudi</title>
  <link rel="stylesheet" href="css/isi.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
    <div class="logo">
        <img src="img/logo koperasi.png" alt="Logo">
        <img src="img/752-SMKN_1_SURABAYA.png" alt="logo">
    </div>

    <div class="element">
      <!-- <img src="element/Untitled design (1).png" alt=""> -->
      <!-- <img src="element/Untitled design (6).png" alt=""> -->
      <!-- <img src="element/Untitled design (7).png" alt=""> -->
    </div>

    <div class="container">
        <h1 class="judul">
          Pengumuman Seleksi Tahap Berikutnya
        </h1>
            <form id="checkForm">
                <input type="text" id="nama" placeholder="Contoh : Henalvaro Farrel Bagas" required>
                <!-- <input type="text" id="kelas" placeholder="Contoh : XI TKJ 1" required> -->
                <button type="submit">Lihat Hasil</button>
            </form>
    </div>
  <script src="js/script.js">
    const form = document.getElementById("form");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const nama = document.getElementById("nama").value.trim();
  if (!nama) return;

  const res = await fetch(`/api/token?nama=${encodeURIComponent(nama)}`);
  const data = await res.json();

  if (!data.token) {
    alert("Gagal membuat token");
    return;
  }

  window.location.href = `/pengumuman.html?token=${data.token}`;
});
  </script>
</body>
</html>
