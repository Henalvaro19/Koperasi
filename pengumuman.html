<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koperasi Pangestu Pambudi</title>
  <link rel="stylesheet" href="css/pengumuman.css">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="logo">
    <img src="img/logo koperasi.png" alt="Logo">
    <img src="img/752-SMKN_1_SURABAYA.png" alt="logo">
  </div>

  <div class="content-wrapper">
    <div class="container">
      <h1>Hasil Seleksi</h1>
      <div id="result"></div>
    </div>
    <div id="selamatContainer"></div>
  </div>

  <canvas id="fireworks"></canvas>
  <script src="js/script.js">

(async () => {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  if (!token) {
    window.location.href = "/isi.html";
    return;
  }

  try {
    const res = await fetch(`/api/token?token=${token}`);
    const data = await res.json();

    if (!data.valid) {
      window.location.href = "/isi.html";
      return;
    }

    // ✅ TOKEN VALID
    console.log("Token valid untuk:", data.nama);

    // AMBIL HASIL SELEKSI
    const hasilRes = await fetch(`/api/getData?nama=${encodeURIComponent(data.nama)}`);
    const hasil = await hasilRes.json();

    window.__HASIL__ = hasil.hasil;
    showResult();

  } catch (err) {
    window.location.href = "/isi.html";
  }
})();
  </script>
</body>
</html>
